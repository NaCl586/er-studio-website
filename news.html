<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Latest news and updates from Education Reinvented Studio."
  >

  <title>ER Studio | News</title>

  <link rel="icon" type="image/png" href="./images/Logo/logo.png">

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    rel="stylesheet"
    href="css/pages.css"
  >

</head>


<body class="news-page">


  <!-- =====================================================
       SITE HEADER & NAVIGATION
       ===================================================== -->

  <header class="site-header">

    <a
      class="brand"
      href="index.html"
      aria-label="ER Studio home"
    >

      <img
        src="images/Logo/Logo + Nama Horizontal Putih.png"
        alt="ER Studio"
        class="brand-logo"
      >

    </a>


    <button
      class="nav-toggle"
      aria-label="Open navigation"
      aria-expanded="false"
      type="button"
    >
      ☰
    </button>


    <nav class="site-nav">

      <a href="index.html">
        Home
      </a>

      <a href="games.html">
        Games
      </a>

      <a href="services.html">
        Services
      </a>

      <a href="about.html">
        About Us
      </a>

      <a
        class="active"
        href="news.html"
      >
        News
      </a>

    </nav>

  </header>



  <!-- =====================================================
       MAIN CONTENT
       ===================================================== -->

  <main>


    <!-- =================================================
         NEWS HERO
         ================================================= -->

    <section class="hero photo-hero news-hero">

      <div class="hero-overlay">

        <h1>
          <span>ER Studio</span> News
        </h1>

      </div>

    </section>



    <!-- =================================================
         NEWS CONTENT
         ================================================= -->

    <section class="news-content">


      <!--
        news.js will automatically generate:

        - Table of contents
        - Headline News section
        - Highlights section
        - Articles
        - Dates
        - Paragraphs
        - Article images
      -->

      <div id="all-news"></div>


    </section>

  </main>



  <!-- =====================================================
       SITE FOOTER
       ===================================================== -->

  <footer
    id="contact"
    class="site-footer"
  >


    <div class="footer-contact">

      <h2>
        Contact Us!
      </h2>


      <p>
        Email :
      </p>


      <p>

        <a
          href="mailto:education.reinvented.studio@gmail.com"
        >
          education.reinvented.studio@gmail.com
        </a>

        <br>

        <a
          href="mailto:gerson.natanael@outlook.com"
        >
          gerson.natanael@outlook.com
        </a>

      </p>

    </div>



    <img
      src="images/Logo/Logo + Nama Horizontal Putih.png"
      alt="ER Studio"
      class="footer-logo"
    >



    <div class="footer-bottom">


      <div class="socials">


        <!-- WhatsApp -->

        <a
          href="http://wa.me/6287888633468"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="WhatsApp"
        >

          <img
            src="images/Icon Sosmed/Whatsapp.png"
            alt="WhatsApp"
          >

        </a>



        <!-- YouTube -->

        <a
          href="https://www.youtube.com/channel/UCxSBws73TBzKOpwoqveHt7w"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="YouTube"
        >

          <img
            src="images/Icon Sosmed/Youtube.png"
            alt="YouTube"
          >

        </a>



        <!-- Instagram -->

        <a
          href="https://www.instagram.com/educationreinventedstudio"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
        >

          <img
            src="images/Icon Sosmed/Instagram.png"
            alt="Instagram"
          >

        </a>

      </div>



      <div class="footer-line"></div>


      <small>
        © 2026 ER STUDIO. ALL RIGHTS RESERVED.
      </small>


    </div>

  </footer>



  <!-- =====================================================
       FLOATING ACTION BUTTON
       ===================================================== -->

  <a
    class="floating-contact"
    href="#contact"
  >
    Contact Us
  </a>



  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script src="js/main.js"></script>

  <script src="js/news.js"></script>


</body>

</html>
