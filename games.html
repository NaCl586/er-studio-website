<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="css/style.css">

<body>

  <!-- =====================================================
     SITE HEADER & NAVIGATION
     ===================================================== -->
  <header class="site-header">

    <a class="brand" href="index.html" aria-label="ER Studio home">
      <img
        src="images/Logo/Logo + Nama Horizontal Putih.png"
        alt="ER Studio"
        class="brand-logo"
      >
    </a>

    <button
      class="nav-toggle"
      aria-label="Open navigation"
      aria-expanded="false"
      type="button"
    >
      ☰
    </button>

    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a class="active" href="games.html">Games</a>
      <a href="services.html">Services</a>
      <a href="about.html">About Us</a>
      <a href="news.html">News</a>

  <main>

       ===================================================== -->
    <section class="hero video-hero">
      <video class="services-video" autoplay muted loop playsinline>
        <source src="./videos/dice on delivery.mp4" type="video/mp4">

    </section>


    <!-- =====================================================
       GAMES SHOWCASE CONTENT
       ===================================================== -->

      <div class="section-heading">
        <h1>Fun <span>Games</span></h1>

      <!-- MOBILE AND WEBGL GAMES SECTION -->
      <div class="section-heading">
        <h2>Mobile and WebGL <span>Games</span></h2>
      </div>
      <div id="mobile-games" class="game-gallery"></div>

      <!-- EDUCATION GAMES SECTION -->
      <div class="section-heading">
        <h2>Education <span>Games</span></h2>
      </div>
      <div id="education-games" class="game-gallery"></div>

    </section>

      <p>Email :</p>

      <p>

        <br>
        <a href="mailto:gerson.natanael@outlook.com">
          gerson.natanael@outlook.com

          <img
            src="images/Icon Sosmed/Whatsapp.png"

        <a

          target="_blank"

          href="https://www.instagram.com/educationreinventedstudio"

        </a>
